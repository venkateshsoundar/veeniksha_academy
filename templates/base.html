<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonts: Inter for UI, Merriweather for headings/logo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v={{ static_version }}">
</head>
<body class="{{ page_class|default('') }}">
    <div class="bg-decor" aria-hidden="true">
        <img class="decor-left" src="{{ url_for('static', filename='ornament-left.svg') }}" alt="" aria-hidden="true">
        <img class="decor-right" src="{{ url_for('static', filename='ornament-right.svg') }}" alt="" aria-hidden="true">
    </div>

    <header class="site-header">
        <div class="logo">Veeniksha Music Academy</div>
        <nav class="main-nav">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('students_list') }}">Students</a>
            <a href="{{ url_for('schedule_session') }}">Schedule</a>
            <a href="{{ url_for('sessions_list') }}">Sessions</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
