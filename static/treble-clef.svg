<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <pattern id="treble-clef-pattern" patternUnits="userSpaceOnUse" width="300" height="400">
      <!-- Treble clef symbol (simplified) -->
      <circle cx="40" cy="80" r="25" fill="none" stroke="rgba(107,35,51,0.06)" stroke-width="2"/>
      <line x1="40" y1="55" x2="40" y2="105" stroke="rgba(107,35,51,0.05)" stroke-width="2"/>
      <circle cx="40" cy="50" r="8" fill="rgba(246,200,95,0.06)"/>
      
      <!-- Music note pair -->
      <circle cx="150" cy="120" r="6" fill="rgba(42,179,169,0.08)"/>
      <path d="M 156 120 L 165 80" stroke="rgba(42,179,169,0.08)" stroke-width="1.5" fill="none"/>
      <circle cx="165" cy="120" r="6" fill="rgba(42,179,169,0.08)"/>
      <path d="M 171 120 L 180 80" stroke="rgba(42,179,169,0.08)" stroke-width="1.5" fill="none"/>
      <path d="M 165 80 L 180 78" stroke="rgba(42,179,169,0.08)" stroke-width="2" fill="none"/>
      
      <!-- Musical wave -->
      <path d="M 0 200 Q 75 180 150 200 T 300 200" stroke="rgba(107,35,51,0.04)" stroke-width="1" fill="none"/>
      
      <!-- Decorative dots -->
      <circle cx="50" cy="250" r="3" fill="rgba(107,35,51,0.06)"/>
      <circle cx="100" cy="280" r="2.5" fill="rgba(246,200,95,0.06)"/>
      <circle cx="200" cy="270" r="2" fill="rgba(42,179,169,0.06)"/>
      <circle cx="280" cy="300" r="3" fill="rgba(107,35,51,0.05)"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#treble-clef-pattern)"/>
</svg>