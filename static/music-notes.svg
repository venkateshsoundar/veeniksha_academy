<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <pattern id="music-notes-pattern" patternUnits="userSpaceOnUse" width="200" height="200">
      <!-- Music note 1 -->
      <circle cx="30" cy="50" r="8" fill="rgba(107,35,51,0.08)" opacity="0.6"/>
      <path d="M 38 50 Q 45 40 50 20" stroke="rgba(107,35,51,0.06)" stroke-width="2" fill="none"/>
      
      <!-- Music note 2 -->
      <circle cx="120" cy="100" r="6" fill="rgba(246,200,95,0.08)" opacity="0.5"/>
      <path d="M 126 100 Q 133 90 138 60" stroke="rgba(246,200,95,0.06)" stroke-width="1.5" fill="none"/>
      
      <!-- Music note 3 -->
      <circle cx="60" cy="150" r="7" fill="rgba(42,179,169,0.06)" opacity="0.4"/>
      <path d="M 67 150 Q 75 135 82 100" stroke="rgba(42,179,169,0.05)" stroke-width="1.5" fill="none"/>
      
      <!-- Staff lines -->
      <line x1="0" y1="80" x2="200" y2="80" stroke="rgba(107,35,51,0.03)" stroke-width="1"/>
      <line x1="0" y1="95" x2="200" y2="95" stroke="rgba(107,35,51,0.03)" stroke-width="1"/>
      <line x1="0" y1="110" x2="200" y2="110" stroke="rgba(107,35,51,0.03)" stroke-width="1"/>
      <line x1="0" y1="125" x2="200" y2="125" stroke="rgba(107,35,51,0.03)" stroke-width="1"/>
      <line x1="0" y1="140" x2="200" y2="140" stroke="rgba(107,35,51,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#music-notes-pattern)"/>
</svg>