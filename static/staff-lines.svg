<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <pattern id="staff-lines-pattern" patternUnits="userSpaceOnUse" width="1200" height="200">
      <!-- Five staff lines -->
      <line x1="0" y1="40" x2="1200" y2="40" stroke="rgba(107,35,51,0.05)" stroke-width="1"/>
      <line x1="0" y1="60" x2="1200" y2="60" stroke="rgba(107,35,51,0.05)" stroke-width="1"/>
      <line x1="0" y1="80" x2="1200" y2="80" stroke="rgba(107,35,51,0.06)" stroke-width="1.5"/>
      <line x1="0" y1="100" x2="1200" y2="100" stroke="rgba(107,35,51,0.05)" stroke-width="1"/>
      <line x1="0" y1="120" x2="1200" y2="120" stroke="rgba(107,35,51,0.05)" stroke-width="1"/>
      
      <!-- Music notes scattered -->
      <circle cx="100" cy="70" r="5" fill="rgba(246,200,95,0.09)"/>
      <circle cx="250" cy="90" r="4" fill="rgba(42,179,169,0.08)"/>
      <circle cx="500" cy="60" r="5" fill="rgba(107,35,51,0.08)"/>
      <circle cx="750" cy="100" r="4" fill="rgba(107,119,222,0.08)"/>
      <circle cx="950" cy="75" r="5" fill="rgba(246,200,95,0.08)"/>
      
      <!-- Note stems -->
      <line x1="100" y1="65" x2="100" y2="30" stroke="rgba(246,200,95,0.08)" stroke-width="1"/>
      <line x1="250" y1="85" x2="250" y2="50" stroke="rgba(42,179,169,0.08)" stroke-width="1"/>
      <line x1="500" y1="55" x2="500" y2="20" stroke="rgba(107,35,51,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#staff-lines-pattern)"/>
</svg>